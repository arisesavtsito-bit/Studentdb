databases:
  - name: gestion-etudiants-db
    databaseName: gestion_etudiants
    user: gestion_app

services:
  - type: web
    name: gestion-etudiants-api
    runtime: node
    rootDir: Backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: gestion-etudiants-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: gestion-etudiants-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: gestion-etudiants-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gestion-etudiants-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: gestion-etudiants-db
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "3000"
